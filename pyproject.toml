[project]

name = "grok-smartvae" 
version = "12.5.0"
description = "Robust VAE decoder suite with streaming output, temporal color correction, and advanced latent management for ComfyUI video workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "uczensokratesa", email = "twój-email@example.com"} 
]
keywords = ["comfyui", "vae", "video", "decoder", "streaming", "color-correction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "torch>=2.0.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/uczensokratesa/ComfyUI-Grok-SmartVAE"
Repository = "https://github.com/uczensokratesa/ComfyUI-Grok-SmartVAE"
Issues = "https://github.com/uczensokratesa/ComfyUI-Grok-SmartVAE/issues"
Changelog = "https://github.com/uczensokratesa/ComfyUI-Grok-SmartVAE/blob/main/CHANGELOG.md"

# === TUTAJ ZACZYNA SIĘ SEKCJA DLA COMFYUI REGISTRY ===
[tool.comfy]
PublisherId = "uczensokratesa"
DisplayName = "ComfyUI-Grok-SmartVAE"
Icon = "https://raw.githubusercontent.com/uczensokratesa/ComfyUI-Grok-SmartVAE/main/web/icon.png?raw=true"
