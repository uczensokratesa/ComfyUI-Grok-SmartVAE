[project]
name = "comfyui-grok-smartvae"
version = "12.0.0"
description = "Robust VAE decoder suite with streaming output, temporal color correction, and advanced latent management for ComfyUI video workflows"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "uczensokratesa", email = "your-email@example.com"}
]
keywords = ["comfyui", "vae", "video", "decoder", "streaming", "color-correction"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "torch>=2.0.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]
full = [
    "opencv-python>=4.8.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/uczensokratesa/ComfyUI-Grok-SmartVAE"
Repository = "https://github.com/uczensokratesa/ComfyUI-Grok-SmartVAE"
Issues = "https://github.com/uczensokratesa/ComfyUI-Grok-SmartVAE/issues"
Changelog = "https://github.com/uczensokratesa/ComfyUI-Grok-SmartVAE/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["comfyui_grok_smartvae"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
